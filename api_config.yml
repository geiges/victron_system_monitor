victron_system_config: /data/python/victron_system_monitor/data/system_configuration.yaml
server:
  host: 0.0.0.0
  port: 5100
  debug: true
file_endpoints:
- id: victron
  description: Victron system monitor log files
  base_dir: data
  allow_patterns:
  - log_*.csv
  - sim_*.csv
  - aux_*.csv
  - aggregations/daily.csv
  - state.json
  - state_mapping.yaml
  - system_configuration.yaml
  - aux_state.yaml
command_endpoints:
- id: mppt150_mppt_mode_read
  type: dbus_read
  description: Read mppt150 mppt_mode
  service: com.victronenergy.solarcharger.ttyUSB0
  path: /Mode
- id: mppt150_mppt_mode_toggle
  type: dbus_toggle
  description: Toggle mppt150 mppt_mode
  service: com.victronenergy.solarcharger.ttyUSB0
  path: /Mode
  values:
  - 1
  - 4
- id: mppt100_mppt_mode_read
  type: dbus_read
  description: Read mppt100 mppt_mode
  service: com.victronenergy.solarcharger.ttyUSB1
  path: /Mode
- id: mppt100_mppt_mode_toggle
  type: dbus_toggle
  description: Toggle mppt100 mppt_mode
  service: com.victronenergy.solarcharger.ttyUSB1
  path: /Mode
  values:
  - 1
  - 4
- id: mppt100_load_state_read
  type: dbus_read
  description: Read mppt100 load_mode
  service: com.victronenergy.solarcharger.ttyUSB1
  path: /Load/Status
- id: mppt100_load_control_read
  type: vedirect_get
  description: Read mppt100 load_control via VE.Direct HEX
  component: mppt100
  register: 60843
- id: mppt100_load_control
  type: vedirect_set
  description: Set mppt100 load_control via VE.Direct HEX
  component: mppt100
  register: 60843
  allowed_values:
  - 0
  - 1
  - 4
  - 5
- id: multiplus_inverter_mode_read
  type: dbus_read
  description: Read multiplus inverter_mode
  service: com.victronenergy.vebus.ttyUSB2
  path: /Mode
- id: multiplus_inverter_mode_toggle
  type: dbus_toggle
  description: Toggle multiplus inverter_mode
  service: com.victronenergy.vebus.ttyUSB2
  path: /Mode
  values:
  - 3
  - 4
